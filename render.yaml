services:
  - type: web
    name: cargox-api
    runtime: docker
    plan: free
    # Build context is the repo root so the image gets both api/ and data/
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      # Tighten after the frontend is live, e.g.
      # "https://cargox.vercel.app,https://cargox-*.vercel.app"
      - key: CORS_ORIGINS
        value: "*"
