#  Keeps the Render free-tier backend from sleeping.
#
#  Render's free plan spins a service down after ~15 minutes of inactivity;
#  the next request then pays a 30-45s cold start while the container and
#  the LightGBM artifacts reload. Pinging every 10 minutes keeps the
#  container resident so real visitors never hit that penalty.
#
#  Notes:
#   - This repo is public, so Actions minutes are free and unmetered.
#   - GitHub's scheduled runs are best-effort and can be delayed during
#     peak load, so the 10-minute interval intentionally leaves ~5 minutes
#     of slack against Render's 15-minute idle timeout.
#   - GitHub auto-disables cron workflows after 60 days with no repo
#     activity. Re-enable from the Actions tab if the demo goes quiet.
#   - A failed ping never fails the job: a red X here would be noise, and
#     the next run is only 10 minutes away.

name: Keep Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC)
  workflow_dispatch:          # allow manual runs from the Actions tab

# If a run is somehow still going when the next fires, drop the old one.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging backend at $(date -u) UTC"
          curl -sS -m 60 -w '\n/health -> HTTP %{http_code} in %{time_total}s\n' \
            https://cargox-api.onrender.com/health \
            || echo "health ping failed, continuing"
          curl -sS -m 60 -o /dev/null -w '/ -> HTTP %{http_code} in %{time_total}s\n' \
            https://cargox-api.onrender.com/ \
            || echo "root ping failed, continuing"

      - name: Done
        run: echo "Keep-alive ping completed"
